name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа для сборки'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux

jobs:
  # Матрица собирается заранее: на уровне job условие `if` не видит контекст
  # matrix (он раскрывается позже), поэтому платформы фильтруем здесь и
  # отдаём готовый JSON в стратегию сборки.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Выбор платформ по вводу
        id: pick
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          WIN='{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","os_name":"windows"}'
          LIN='{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","os_name":"linux"}'
          case "$PLATFORM" in
            windows) INCLUDE="[$WIN]" ;;
            linux)   INCLUDE="[$LIN]" ;;
            *)       INCLUDE="[$WIN,$LIN]" ;;
          esac
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libv4l-dev \
            v4l-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build custom installer (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run build:installer

      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Build custom installer (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run build:installer

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/ASCII-Art-Studio-Setup.exe

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            dist-installer/ASCII-Art-Studio-Setup
