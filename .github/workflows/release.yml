name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows: собираем кастомный установщик (не NSIS) ──────────────
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer

      - name: Install frontend dependencies
        run: npm ci

      # Собирает приложение -> zip -> вшивает в кастомный установщик.
      # Результат: dist-installer/ASCII-Art-Studio-Setup.exe
      - name: Build custom installer
        run: npm run build:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/ASCII-Art-Studio-Setup.exe

      - name: Attach installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-installer/ASCII-Art-Studio-Setup.exe
          name: "ASCII Art Studio ${{ github.ref_name }}"
          body: |
            Кастомный установщик для Windows и пакеты для Linux.

            Windows: скачайте ASCII-Art-Studio-Setup.exe и запустите.
            Установка per-user, без прав администратора.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux: стандартные AppImage / deb ────────────────────────────
  linux-bundle:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libv4l-dev \
            v4l-utils \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # В репозитории ДВА tauri-проекта (приложение и установщик) —
          # без явного projectPath экшен путает их и ищет артефакты
          # в installer/target, где ничего не бандлится.
          projectPath: src-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.sha) }}
          releaseName: "ASCII Art Studio ${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          releaseBody: 'Кастомный установщик для Windows и пакеты для Linux'
          releaseDraft: true
          prerelease: false
          args: '--target x86_64-unknown-linux-gnu'

      # Кастомный установщик (тот же UI, что на Windows): собирает payload
      # и вшивает его в единый self-contained бинарник.
      - name: Build custom installer (Linux)
        run: npm run build:installer

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist-installer/ASCII-Art-Studio-Setup

      - name: Attach Linux installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-installer/ASCII-Art-Studio-Setup
          name: "ASCII Art Studio ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
