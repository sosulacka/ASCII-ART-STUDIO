[package]
name = "asciiartstudio"
version = "0.1.0"
description = "It's ASCII ART STUDIO"
authors = ["Cyn"]
edition = "2021"
license = "MIT"

[lib]
name = "asciiartstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
imageproc = "0.25"
ab_glyph = "0.2"
tempfile = "3"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = "0.7"
async-stream = "0.3"
base64 = "0.22"
rayon = "1"
once_cell = "1"
ureq = { version = "2", features = ["json", "tls"] }

libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_DirectShow",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
v4l = "0.14"

# Оптимизация release: thin-LTO даёт ~95% выигрыша fat-LTO,
# но собирается почти вдвое быстрее
[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

# dev: быстрее линковка — меньше отладочной инфы (номера строк остаются,
# полные PDB для step-дебага не нужны в 99% случаев).
# opt-level 1: горячие пиксельные циклы нашего кода (webcam/vcam fit)
# на opt 0 не тянут 30 fps — выходной поток виртуальной камеры лагал
# в dev-сборке, хотя release был бы в порядке.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Зависимости оптимизируем даже в dev-сборке, иначе image/imageproc в debug
# невыносимо медленные (декодирование PNG в 20-50 раз медленнее).
# Цена — разовая при первой сборке, дальше кэшируется.
[profile.dev.package."*"]
opt-level = 2
