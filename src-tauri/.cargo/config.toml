# Ускорение сборки (см. обсуждение в репо):
# rust-lld — многопоточный линковщик из LLVM, идёт в комплекте с тулчейном.
# Линковка происходит при КАЖДОЙ пересборке, так что это главный выигрыш
# для итеративной разработки (дефолтный MSVC link.exe заметно медленнее).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
